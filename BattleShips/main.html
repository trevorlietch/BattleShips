<!DOCTYPE html>
    <head>
        <title>WebGL Class</title>
    </head>
    <script src="WebGL.js"></script>
    <script src="Functions.js"></script>
    <body>
        <button id="rotateShipBtn">Rotate Ship</button>
        <button id="confirmTurnBtn">Confirm Turn</button>
        <br>
        <canvas id="example" tabindex="0" width="1000" height="700" style="border:5px solid black;"></canvas>
        <script id="vertex-shader" type="x-shader/x-vertex">
            #version 300 es                 // Use GLSL ES 3.00 (required for WebGL 2)
            
            in vec3 coordinates;            // Vertex position attribute (x, y, z)
            in vec3 color;                  // Vertex color attribute (r, g, b)
            out vec3 vColor;                // Output color passed to the fragment shader
            uniform mat4 uTranslate;        // Translation Matrix uniform
            uniform mat4 uScale;            //Scale Matrix uniform
            uniform mat4 uRotateY;           // Y Rotation Matrix uniform
            uniform mat4 uRotateX;           // X Rotation Matrix uniform
            uniform mat4 uRotateZ;           // Z Rotation Matrix uniform
            uniform mat4 uView;              // View Matrix uniform
            uniform mat4 uProjection;

            void main(){                    // Runs once per vertex
                vColor = color;             // Pass vertex color to fragment shader
                gl_Position = uProjection * uView * uTranslate * uRotateZ * uRotateY * uRotateX * uScale * vec4(coordinates, 1.0); 
            }
        
            </script>
            <script id="fragment-shader" type="x-shader/x-fragment">
                #version 300 es              // Use GLSL ES 3.00 (required for WebGL 2)

                precision mediump float;     // Set default floating-point precision
                in vec3 vColor;              // Interpolated color from vertex shader
                out vec4 FragColor;           // Final output color of the fragment
                
                void main(){                 // Runs once per fragment (pixel)
                    FragColor = vec4(vColor, 1.0); // Output RGBA color (opaque)
                }
            
            </script>
        <script>
            // Shape class that stores vertex + color data in separate buffers and renders it using WebGL
            // ONE VAO per shape (mesh). The VAO remembers attribute layout + buffer bindings.
            class Shape {
                constructor(vertices, colors, indices, mode = gl.TRIANGLES) {
                    this.vertices = vertices;
                    this.indices = indices;
                    this.mode = mode;

                    this.colors = colors;
                    this.size = [1.0, 1.0, 1.0];
                    this.position = [0.0, 0.0, 0.0];
                    this.rotY = 0.0;
                    this.rotX = 0.0;
                    this.rotZ = 0.0;

                    this.vao = setVAO();

                    bindVAO(this.vao);

                    // create buffers once
                    this.vertexBuffer = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuffer);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.vertices), gl.STATIC_DRAW);

                    let coordLoc = gl.getAttribLocation(myWebGL.program, "coordinates");
                    gl.enableVertexAttribArray(coordLoc);
                    gl.vertexAttribPointer(coordLoc, 3, gl.FLOAT, false, 0, 0);

                    this.colorBuffer = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.colors), gl.DYNAMIC_DRAW);

                    let colorLoc = gl.getAttribLocation(myWebGL.program, "color");
                    gl.enableVertexAttribArray(colorLoc);
                    gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

                    this.indexBuffer = gl.createBuffer();
                    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
                    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(this.indices), gl.STATIC_DRAW);

                    unbindVAO();
                }

                render() {
                    Scale(myWebGL, this.size[0], this.size[1], this.size[2]);
                    Translate(myWebGL, this.position[0], this.position[1], this.position[2]);

                    RotateY(myWebGL, this.rotY);
                    RotateX(myWebGL, this.rotX);
                    RotateZ(myWebGL, this.rotZ);

                    bindVAO(this.vao);

                    // only update color buffer when rendering
                    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
                    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.colors), gl.DYNAMIC_DRAW);

                    gl.drawElements(this.mode, this.indices.length, gl.UNSIGNED_SHORT, 0);

                    unbindVAO();
                }
            }

        </script>
        
        <script>            
            // Get the canvas element from the HTML document
            var canvas = document.getElementById("example");
            // Create a WebGL2 rendering context from the canvas
            var gl= canvas.getContext('webgl2');
            // Instantiate the WebGL helper class
            var myWebGL= new WebGL();
            // Event listener for mouse clicks
            canvas.addEventListener("contextmenu", (e) => e.preventDefault());


            // Camera 
            let moveSpeed = 0.02;
            let cameraUp = [0, -1, 0];

            const cameraA = {
                position: [0, 2.2, 1.7],
                target: [0, 0.1, -0.15]
            };

            const cameraB = {
                position: [0, -2.2, 1.7], // [0, -2.2, 1.7]
                target: [0, 0.1, -0.15]
            };

            let cameraPos = [...cameraA.position];
            let cameraTarget = [...cameraA.target];

            let keyW = false;
            let keyA = false;
            let keyS = false;
            let keyD = false;
            let keySpace = false;
            let keyShift = false;

            // Scene dimensions
            const outerX = 1.0;
            const outerY = 0.9;
            const innerX = 0.6;
            const innerY = 0.7;

            const grassZ = 0.20;
            const waterZ = -0.15;
    
            // Rectangles for water
            let waterWidth = 0.6;
            let sandWidth = 0.2;

            var waterVertices = [
                -waterWidth, -0.7, waterZ,
                waterWidth, -0.7, waterZ,
                waterWidth,  0.7, waterZ,

                -waterWidth, -0.7, waterZ,
                waterWidth,  0.7, waterZ,
                -waterWidth,  0.7, waterZ
            ];

            var waterColors = [
            0.0, 0.25, 0.55,
            0.0, 0.25, 0.55,
            0.0, 0.25, 0.55,

            0.0, 0.25, 0.55,
            0.0, 0.25, 0.55,
            0.0, 0.25, 0.55
        ];

            var waterIndices = [0,1,2, 3,4,5];

            var Water = new Shape(waterVertices, waterColors, waterIndices);
            
            // Sand for beach
            var sandLeftVertices = [
                -outerX, -outerY, grassZ,
                -innerX, -innerY, waterZ,
                -innerX,  innerY, waterZ,

                -outerX, -outerY, grassZ,
                -innerX,  innerY, waterZ,
                -outerX,  outerY, grassZ
            ];

            var sandRightVertices = [
                innerX, -innerY, waterZ,
                outerX, -outerY, grassZ,
                outerX,  outerY, grassZ,

                innerX, -innerY, waterZ,
                outerX,  outerY, grassZ,
                innerX,  innerY, waterZ
            ];

            var sandTopVertices = [
                -outerX, outerY, grassZ,
                outerX, outerY, grassZ,
                innerX, innerY, waterZ,

                -outerX, outerY, grassZ,
                innerX, innerY, waterZ,
                -innerX, innerY, waterZ
            ];

            var sandBottomVertices = [
                -innerX, -innerY, waterZ,
                innerX, -innerY, waterZ,
                outerX, -outerY, grassZ,

                -innerX, -innerY, waterZ,
                outerX, -outerY, grassZ,
                -outerX, -outerY, grassZ
            ];

            var sandColors = [
                0.9, 0.8, 0.5,
                0.9, 0.8, 0.5,
                0.9, 0.8, 0.5,

                0.9, 0.8, 0.5,
                0.9, 0.8, 0.5,
                0.9, 0.8, 0.5
            ];

            // Grass
            var grassLeftVertices = [
                -4.0, -2.0, grassZ,
                -outerX, -2.0, grassZ,
                -outerX,  2.0, grassZ,

                -4.0, -2.0, grassZ,
                -outerX,  2.0, grassZ,
                -4.0,  2.0, grassZ
            ];

            var grassRightVertices = [
                outerX, -2.0, grassZ,
                4.0,    -2.0, grassZ,
                4.0,     2.0, grassZ,

                outerX, -2.0, grassZ,
                4.0,     2.0, grassZ,
                outerX,  2.0, grassZ
            ];

            var grassTopVertices = [
                -outerX, outerY, grassZ,
                outerX, outerY, grassZ,
                outerX, 2.0,    grassZ,

                -outerX, outerY, grassZ,
                outerX, 2.0,    grassZ,
                -outerX, 2.0,    grassZ
            ];

            var grassBottomVertices = [
                -outerX, -2.0, grassZ,
                outerX, -2.0, grassZ,
                outerX, -outerY, grassZ,

                -outerX, -2.0, grassZ,
                outerX, -outerY, grassZ,
                -outerX, -outerY, grassZ
            ];

            var grassColors = [
                0.2, 0.7, 0.2,
                0.2, 0.7, 0.2,
                0.2, 0.7, 0.2,

                0.2, 0.7, 0.2,
                0.2, 0.7, 0.2,
                0.2, 0.7, 0.2
            ];

            // Divider Line between grids
            var dividerVertices = [
                -0.35, 0, -0.08,
                0.35, 0, -0.08
            ];

            var dividerColors = [
                0,0,0,
                0,0,0
            ];

            var dividerIndices = [0,1];

            var divider = new Shape(dividerVertices, dividerColors, dividerIndices, gl.LINES);

            var sandLeft = new Shape(sandLeftVertices, sandColors, waterIndices);
            var sandRight = new Shape(sandRightVertices, sandColors, waterIndices);
            var sandTop = new Shape(sandTopVertices, sandColors, waterIndices);
            var sandBottom = new Shape(sandBottomVertices, sandColors, waterIndices);

            var grassLeft = new Shape(grassLeftVertices, grassColors, waterIndices);
            var grassRight = new Shape(grassRightVertices, grassColors, waterIndices);
            var grassTop = new Shape(grassTopVertices, grassColors, waterIndices);
            var grassBottom = new Shape(grassBottomVertices, grassColors, waterIndices);

            var gridTop = createTileGrid(0.0, 0.30, 0.05, 0.0, 8);
            var gridBottom = createTileGrid(0.0, -0.30, 0.05, 0.0, 8);

            // Game state variables
            let currentSetupPlayer = "bottom"; // "top" or "bottom"
            let isPlayerBView = false;
            //Ship Placements
            const SHIP_LENGTHS = [5, 4, 3, 3, 2];

            let playerAFleet = [];
            let playerBFleet = [];

            let availableShips = [];
            let selectedShip = null;
            let previewCells = [];

            let setupDone = false;

            let hoveredTile = null;

            let mouseX = 0;
            let mouseY = 0;

            availableShips = makeFleetForCurrentPlayer();

            canvas.addEventListener("mousemove", (e) => {
                let rect = canvas.getBoundingClientRect();

                let x = (e.clientX - rect.left) / rect.width;
                let y = (e.clientY - rect.top) / rect.height;

                mouseX = (x - 0.5) * 2;
                mouseY = (0.5 - y) * 2;

            });

            canvas.addEventListener("click", () => {
                if (setupDone) return;

                const aspect = canvas.width / canvas.height;
                const ray = rayFromMouse(mouseX, mouseY, aspect, Math.PI / 3, cameraPos, cameraTarget, cameraUp);

                // side ships live on their own plane
                const sideHit = intersectRayWithZPlane(ray.origin, ray.direction, 0.35);

                if (sideHit) {
                    const picked = pickShipFromSide(sideHit[0], -sideHit[1]);
                    if (picked) {
                        selectedShip = picked;
                        previewCells = [];
                        return;
                    }
                }

                // grid placement lives on the grid plane
                const gridHit = intersectRayWithZPlane(ray.origin, ray.direction, -0.10);
                if (!gridHit) return;

                if (!selectedShip) return;
                if (previewCells.length !== selectedShip.length) return;

                const activeFleet = currentSetupPlayer === "bottom" ? playerAFleet : playerBFleet;

                selectedShip.placed = true;
                selectedShip.cells = [...previewCells];
                activeFleet.push(selectedShip);

                selectedShip = null;
                previewCells = [];
            });

            // Rotate ship button
            document.getElementById("rotateShipBtn").addEventListener("click", () => {
                if (selectedShip) {
                    selectedShip.horizontal = !selectedShip.horizontal;
                    updateShipPreview();
                }
            });
            // User can also press "R" key to rotate ship
            window.addEventListener("keydown", (e) => {
                if (e.key.toLowerCase() === "r" && selectedShip) {
                    selectedShip.horizontal = !selectedShip.horizontal;
                    updateShipPreview();
                }
            });

            // Confirm turn button
            document.getElementById("confirmTurnBtn").addEventListener("click", () => {
                const allPlaced = availableShips.every(ship => ship.placed);
                if (!allPlaced) return;

                if (currentSetupPlayer === "bottom") {
                    cameraPos = [...cameraB.position];
                    cameraTarget = [...cameraB.target];
                    cameraUp = [0, 1, 0];

                    currentSetupPlayer = "top";
                    isPlayerBView = true;

                    selectedShip = null;
                    previewCells = [];
                    availableShips = makeFleetForCurrentPlayer();
                } else {
                    setupDone = true;
                }
            });

            // key listeners
            window.addEventListener("keydown", (e) => {
                switch (e.key.toLowerCase()) {
                    case "w": keyW = true; break;
                    case "a": keyA = true; break;
                    case "s": keyS = true; break;
                    case "d": keyD = true; break;
                    case " ": keySpace = true; break;
                }

                if (e.key === "Shift") {
                    keyShift = true;
                }
            });

            window.addEventListener("keyup", (e) => {
                switch (e.key.toLowerCase()) {
                    case "w": keyW = false; break;
                    case "a": keyA = false; break;
                    case "s": keyS = false; break;
                    case "d": keyD = false; break;
                    case " ": keySpace = false; break;
                }

                if (e.key === "Shift") {
                    keyShift = false;
                }
            });

            function updateCamera() {
                // forward direction toward where camera is looking,
                // but flattened onto the water plane
                let forward = [
                    cameraTarget[0] - cameraPos[0],
                    0,
                    cameraTarget[2] - cameraPos[2]
                ];

                let len = Math.hypot(forward[0], forward[2]);
                if (len < 0.0001) {
                    forward = [0, 0, -1];
                } 
                else {
                    forward = [forward[0] / len, 0, forward[2] / len];
                }

                // right vector on the water plane
                let right = [forward[2], 0, -forward[0]];

                // keep same viewing tilt
                let lookOffset = [
                    cameraTarget[0] - cameraPos[0],
                    cameraTarget[1] - cameraPos[1],
                    cameraTarget[2] - cameraPos[2]
                ];

                if (keyShift) {
                    cameraPos[0] += forward[0] * moveSpeed;
                    cameraPos[2] += forward[2] * moveSpeed;
                }
                if (keySpace) {
                    cameraPos[0] -= forward[0] * moveSpeed;
                    cameraPos[2] -= forward[2] * moveSpeed;
                }
                if (!isPlayerBView) {
                    if (keyA) {
                        cameraPos[0] -= right[0] * moveSpeed;
                        cameraPos[2] -= right[2] * moveSpeed;
                    }
                    if (keyD) {
                        cameraPos[0] += right[0] * moveSpeed;
                        cameraPos[2] += right[2] * moveSpeed;
                    }
                } else {
                    if (keyA) {
                        cameraPos[0] += right[0] * moveSpeed;
                        cameraPos[2] += right[2] * moveSpeed;
                    }
                    if (keyD) {
                        cameraPos[0] -= right[0] * moveSpeed;
                        cameraPos[2] -= right[2] * moveSpeed;
                    }
                }

                // vertical only
                if (!isPlayerBView) {
                    if (keyW) {
                        cameraPos[1] -= moveSpeed;
                    }
                    if (keyS) {
                        cameraPos[1] += moveSpeed;
                    }
                } else {
                    if (keyW) {
                        cameraPos[1] += moveSpeed;
                    }
                    if (keyS) {
                        cameraPos[1] -= moveSpeed;
                    }
                }

                // restore the same camera tilt/look
                cameraTarget = [
                    cameraPos[0] + lookOffset[0],
                    cameraPos[1] + lookOffset[1],
                    cameraPos[2] + lookOffset[2]
                ];
            }

            // Make ships
            function makeFleetForCurrentPlayer() {
                return SHIP_LENGTHS.map((len, i) => ({
                    id: i,
                    length: len,
                    horizontal: true,
                    placed: false,
                    cells: [],
                    sideX: currentSetupPlayer === "bottom" ? 1.35 : -1.35,
                    sideY: 0.55 - i * 0.18
                }));
            }

            // Check if a point is inside a rectangle (used for picking ships on the side)
            function pickShipFromSide(worldX, worldY) {
                for (let ship of availableShips) {
                    if (ship.placed) continue;

                    const width = ship.horizontal ? ship.length * 0.05 : 0.05;
                    const height = ship.horizontal ? 0.05 : ship.length * 0.05;

                    if (pointInRect(worldX, worldY, ship.sideX, ship.sideY, width, height)) {
                        return ship;
                    }
                }
                return null;
            }

            // Shows preview of where your ship will be on the grid
            function updateShipPreview() {
                previewCells = [];

                if (!selectedShip) return;
                if (!hoveredTile) return;

                const activeGrid = currentSetupPlayer === "bottom" ? gridBottom : gridTop;
                const activeFleet = currentSetupPlayer === "bottom" ? playerAFleet : playerBFleet;

                const cells = getPlacementCells(
                    hoveredTile,
                    selectedShip.length,
                    selectedShip.horizontal,
                    activeGrid
                );

                if (!cells) return;
                if (cellsOverlapPlacedShip(cells, activeFleet)) return;

                previewCells = cells;
            }

            // Draw ships on the side that haven't been placed yet
            function drawSideShips() {
                const flipY = -1;

                for (let ship of availableShips) {
                    if (ship.placed) continue;

                    const tileSize = 0.05;
                    const width = ship.horizontal ? ship.length * tileSize : tileSize;
                    const height = ship.horizontal ? tileSize : ship.length * tileSize;

                    const halfW = width / 2;
                    const halfH = height / 2;

                    const shipZ = 0.35;

                    const verts = [
                        ship.sideX - halfW, ship.sideY - halfH, shipZ,
                        ship.sideX + halfW, ship.sideY - halfH, shipZ,
                        ship.sideX + halfW, ship.sideY + halfH, shipZ,

                        ship.sideX - halfW, ship.sideY - halfH, shipZ,
                        ship.sideX + halfW, ship.sideY + halfH, shipZ,
                        ship.sideX - halfW, ship.sideY + halfH, shipZ
                    ];

                    const cols = Array(6).fill().flatMap(() =>
                        selectedShip && selectedShip.id === ship.id
                            ? [1.0, 0.8, 0.2]
                            : [0.7, 0.7, 0.7]
                    );

                    const inds = [0, 1, 2, 3, 4, 5];
                    const shape = new Shape(verts, cols, inds);
                    shape.size[1] = flipY;
                    if (selectedShip && selectedShip.id === ship.id) {
                        console.log("selected ship", ship.id, ship.length);
                    }
                    shape.render();
                }
            }

            function animate(){
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                let aspect = canvas.width / canvas.height;

                updateCamera();

                Projection(myWebGL, Math.PI / 3, aspect, 0.1, 100);
                
                View(myWebGL, cameraPos, cameraTarget, cameraUp);

                const flipY = -1;

                grassLeft.size[1] = flipY;
                grassRight.size[1] = flipY;
                grassTop.size[1] = flipY;
                grassBottom.size[1] = flipY;

                sandLeft.size[1] = flipY;
                sandRight.size[1] = flipY;
                sandTop.size[1] = flipY;
                sandBottom.size[1] = flipY;

                Water.size[1] = flipY;
                divider.size[1] = flipY;

                // Render Scene
                grassLeft.render();
                grassRight.render();
                grassTop.render();
                grassBottom.render();

                sandLeft.render();
                sandRight.render();
                sandTop.render();
                sandBottom.render();

                Water.render();
                divider.render();

                gridTop.forEach(tile => {
                    tile.color = [0.10, 0.50, 0.90];
                });

                gridBottom.forEach(tile => {
                    tile.color = [0.10, 0.50, 0.90];
                });

                for (let ship of playerAFleet) {
                    for (let cell of ship.cells) {
                        cell.color = [1.0, 0.0, 0.0];
                    }
                }

                for (let ship of playerBFleet) {
                    for (let cell of ship.cells) {
                        cell.color = [1.0, 0.0, 0.0];
                    }
                }

                // Hovered detection
                const ray = rayFromMouse(mouseX, mouseY, aspect, Math.PI / 3, cameraPos, cameraTarget, cameraUp);
                const hitPoint = intersectRayWithZPlane(ray.origin, ray.direction, -0.10);

                hoveredTile = null;

                if (hitPoint && !setupDone) {
                    let hoverX = hitPoint[0];
                    let hoverY = hitPoint[1];

                    // because you flip everything with size[1] = -1
                    hoverY = -hoverY;

                    if (currentSetupPlayer === "bottom") {
                        hoveredTile = getHoveredTile(hoverX, hoverY, gridBottom);
                    } 
                    else if (currentSetupPlayer === "top") {
                        hoveredTile = getHoveredTile(hoverX, hoverY, gridTop);
                    }
                }

                if (hoveredTile && !hoveredTile.isShip) {
                    hoveredTile.color = [1.0, 1.0, 0.6];
                }

                updateShipPreview();
                drawSideShips();

                // Render tiles
                gridTop.forEach(tile => {
                    for (let cell of previewCells) {
                        cell.color = [0.8, 0.8, 0.8];
                    }
                    tile.fill.colors = Array(6).fill().flatMap(() => tile.color);
                    tile.fill.size[1] = flipY;
                    tile.outline.size[1] = flipY;

                    tile.fill.render();
                    tile.outline.render();
                });

                gridBottom.forEach(tile => {
                    for (let cell of previewCells) {
                        cell.color = [0.8, 0.8, 0.8];
                    }
                    tile.fill.colors = Array(6).fill().flatMap(() => tile.color);
                    tile.fill.size[1] = flipY;
                    tile.outline.size[1] = flipY;

                    tile.fill.render();
                    tile.outline.render();
                });

                requestAnimationFrame(animate);
            }
            animate();

        </script>

    </body>
</html>
