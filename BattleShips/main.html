        <script id="vertex-shader" type="x-shader/x-vertex">
            #version 300 es                               // GLSL ES 3.00
            in vec3 coordinates;                          // Vertex position
            in vec2 textureCoordinates;                   // Texture coordinates
            in vec3 normal;                               // Vertex normal
            in vec3 tangent;                              // Vertex tangent
            in vec3 bitangent;                            // Vertex bitangent
		    out vec2 vtextureCoordinates;                 // Texture coordinates out
            out vec3 vCubeMapCoordinates;                 // Cubemap coordinates out
            out vec3 vWorldPosition;                      // World position out
            out vec3 vWorldNormal;                        // World normal out
            out vec3 vWorldTangent;                       // World tangent out
            out vec3 vWorldBitangent;                     // World bitangent out
            uniform mat4 uScale;                          // Scale matrix uniform
            uniform mat4 uTranslate;                      // Translate matrix uniform
            uniform mat4 uXRotate;                        // X rotation matrix uniform
            uniform mat4 uYRotate;                        // Y rotation matrix uniform
            uniform mat4 uZRotate;                        // Z rotation matrix uniform
            uniform mat4 uP_Matrix;                       // Projection matrix uniform
            uniform mat4 uView_matrix;                    // View matrix uniform
            void main(){                                  
                vtextureCoordinates = textureCoordinates; // Pass texture coordinates
                vCubeMapCoordinates = coordinates;        // Pass cubemap coordinates
                mat4 uRotate = uZRotate * uYRotate * uXRotate;      // Combined rotation matrix
                mat4 modelMatrix = uTranslate * uRotate * uScale;   // Model matrix
                vec4 worldPosition = modelMatrix * vec4(coordinates, 1.0); // World position
                vWorldPosition = worldPosition.xyz;      // Store world position
                vWorldNormal = mat3(uRotate) * normal;   // Store world normal
                vWorldTangent = mat3(uRotate) * tangent; // Store world tangent
                vWorldBitangent = mat3(uRotate) * bitangent; // Store world bitangent
                mat4 VPMatrix = uP_Matrix * uView_matrix;            // View projection matrix
                mat4 MVPMatrix = VPMatrix * modelMatrix;             // Model view projection matrix
                gl_Position = MVPMatrix * vec4(coordinates, 1.0);    // Final Clip-space position
            }                                             
        
            </script>
            <script id="fragment-shader" type="x-shader/x-fragment">
                #version 300 es                                      // GLSL ES 3.00
                precision mediump float;                             // Float precision
                in vec2 vtextureCoordinates;                         // Texture coordinates in
                in vec3 vCubeMapCoordinates;                         // Cubemap coordinates in
                in vec3 vWorldPosition;                              // World position in
                in vec3 vWorldNormal;                                // World normal in
                in vec3 vWorldTangent;                               // World tangent in
                in vec3 vWorldBitangent;                             // World bitangent in
                uniform sampler2D uTexture;                          // 2D texture sampler
                uniform samplerCube uCubeMap;                        // Cubemap sampler
                uniform sampler2D uNormalMap;                        // Tangent-space normal map sampler
                uniform bool uUseSkybox;                             // Skybox toggle
                uniform bool uUseReflectionMap;                      // Reflection toggle
                uniform bool uUseBlendMap;                           // Blend toggle
                uniform float uBlendFactor;                          // Blend factor
                uniform float uBumpStrength;                         // Normal-map intensity
                uniform vec3 uCameraPosition;                        // Camera position
                
                const int MAX_LIGHTS = 4;
                uniform int uLightCount;
                uniform vec4 LightPos[MAX_LIGHTS];                   // Light positions/directions
                uniform vec4 ambientLight[MAX_LIGHTS];               // Ambient light
		        uniform vec4 diffuseLight[MAX_LIGHTS];               // Diffuse light
		        uniform vec4 specularLight[MAX_LIGHTS];              // Specular light
		        uniform vec4 ambientMat;                             // Ambient Material
		        uniform vec4 diffuseMat;                             // Diffuse Material
		        uniform vec4 specularMat;                            // Specular Material
                uniform float shininess;                             // Shininess Coefficient

                out vec4 FragColor;                                  // Fragment color out
                
                vec3 getMappedNormal(){                              // Convert tangent-space normal map data into a world-space normal
                    vec3 baseNormal = normalize(vWorldNormal);       // Normalize the interpolated mesh normal
                    vec3 tangent = vWorldTangent - baseNormal * dot(baseNormal, vWorldTangent); // Re-orthogonalize the tangent against the normal
                    vec3 bitangent = vWorldBitangent - baseNormal * dot(baseNormal, vWorldBitangent); // Re-orthogonalize the bitangent against the normal
                    if(length(tangent) < 0.0001 || length(bitangent) < 0.0001)
                    {
                        return baseNormal;                           // Fall back to the mesh normal if the UV derivatives are degenerate
                    }
                    tangent = normalize(tangent);                    // Normalize the tangent vector
                    bitangent = normalize(bitangent);                // Normalize the bitangent vector
                    vec3 sampledNormal = texture(uNormalMap, vtextureCoordinates).rgb * 2.0 - 1.0; // Convert the normal map from [0,1] into [-1,1]
                    sampledNormal = normalize(vec3(sampledNormal.xy * uBumpStrength, sampledNormal.z)); // Scale the tangent-space x/y perturbation
                    mat3 TBN = mat3(tangent, bitangent, baseNormal); // Build the tangent-to-world transform
                    return normalize(TBN * sampledNormal);           // Transform the tangent-space normal into world space
                }                                                    
                
                void main(){                                              
                    if(uUseSkybox)                                   
                    {                                                
                        FragColor = texture(uCubeMap, normalize(vCubeMapCoordinates)); // Skybox/CubeMap
                    }                                                
                    else                                             
                    {                                                
                        vec3 surfaceNormal = getMappedNormal();      // Build the normal-mapped normal once per fragment
                        
                        vec3 viewDirection = normalize(uCameraPosition - vWorldPosition); // V = normalize(cameraPosition - fragmentPosition)
                        vec4 ambientAccum = vec4(0.0);
                        vec4 diffuseAccum = vec4(0.0);
                        vec4 specularAccum = vec4(0.0);

                        for (int i = 0; i < MAX_LIGHTS; ++i) {
                            if (i >= uLightCount) {
                                break;
                            }

                            vec3 lightDirection = vec3(0.0, 0.0, 1.0);
                            float attenuation = 1.0;

                            if (LightPos[i].w == 0.0) {
                                lightDirection = normalize(LightPos[i].xyz);
                            } else {
                                vec3 lightVector = LightPos[i].xyz - vWorldPosition;
                                float lightDistance = length(lightVector);
                                lightDirection = normalize(lightVector);
                                
                                /**********************************************/
                                //STEP 1: Implement point-light attenuation using the attenuation equation

                                attenuation = 1.0 / (1.0 + 0.09 * lightDistance + 0.032 * lightDistance * lightDistance);
                                /**********************************************/
                            }
                            /**********************************************/
                            // STEP 2:
                            // Compute the material-light products using component-wise multiplication.
                            vec4 ambientProduct = ambientLight[i] * ambientMat; //A
			                vec4 diffuseProduct = diffuseLight[i] * diffuseMat; //D_base
			                vec4 specularProduct = specularLight[i] * specularMat; //S_base
                            /**********************************************/


                            /**********************************************/
                            // STEP 3:
                            // Calculate Lambert diffuse and final diffuse color
                            float Kd = max(dot(surfaceNormal, lightDirection), 0.0);
                            vec4 diffuse = Kd * attenuation * diffuseProduct;
                            /**********************************************/
                            
                            /**********************************************/
                            // STEP 4:
                            // Blinn-Phong specular:
                            vec3 viewHalfVector = normalize(lightDirection + viewDirection); // H = normalize(L + V)
                            float Ks = pow(max(dot(surfaceNormal, viewHalfVector), 0.0), shininess);
			                vec4 specular = Ks * attenuation * specularProduct;
                            /**********************************************/

                            /**********************************************/
                            // STEP 5:
                            // If the light is behind the surface, remove the specular term.
                            if (dot(surfaceNormal, lightDirection) < 0.0) {
                                specular = vec4(0.0);
                            }
                            /**********************************************/

                            /**********************************************/
                            // STEP 6:
                            // Accumulate the ambient, diffuse, and specular contributions.
                            // Since they are all vec4 you can do it like: ambientAccum += ambientProduct;
                            for (int j = 0; j < 4; ++j) {
                                ambientAccum[j] += ambientProduct[j];
                                diffuseAccum[j] += diffuse[j];
                                specularAccum[j] += specular[j];
                            }
                            /**********************************************/
                        }

                        vec3 ambientDiffuseColor = vec3(1.0);
                        vec3 specularColor = vec3(0.0);

                        /**********************************************/
                        // STEP 7:
                        // Clamp the final lighting colors.
                        ambientDiffuseColor = clamp((ambientAccum + diffuseAccum).rgb, 0.0, 1.0);
                        specularColor = clamp(specularAccum.rgb, 0.0, 1.0);
                        /**********************************************/

                        if(uUseReflectionMap)                        
                        {                                            
                            vec3 incidentDirection = -viewDirection; // Incident direction
                            vec3 reflectionDirection = reflect(incidentDirection, surfaceNormal); // Reflection direction
                            vec4 reflectionColor = texture(uCubeMap, reflectionDirection); // Sample the reflected cubemap color
                            
                            /**********************************************/
                            // STEP 8a:
                            // Shade the reflection map using ambientDiffuseColor and specularColor.
                            FragColor = vec4(reflectionColor.rgb * (0.65 + 0.35 * ambientDiffuseColor) + specularColor, reflectionColor.a);
                            // FragColor = reflectionColor;
                            /**********************************************/
                            
                        }                                            
                        else if(uUseBlendMap)                        
                        {                                            
                            vec3 incidentDirection = -viewDirection; // Incident direction
                            vec3 reflectionDirection = reflect(incidentDirection, surfaceNormal); // Reflection direction
                            vec4 baseTextureColor = texture(uTexture, vtextureCoordinates); // Base texture color
                            /**********************************************/
                            // STEP 8b:
                            // Build the shaded base color using ambientDiffuseColor and specularColor.
                            vec4 bumpedBaseColor = vec4(baseTextureColor.rgb * ambientDiffuseColor + specularColor, baseTextureColor.a);
                            vec4 reflectionColor = texture(uCubeMap, reflectionDirection); // Calculate Reflection color
                            FragColor = mix(bumpedBaseColor, reflectionColor, uBlendFactor); // Blend the bumped base color with the reflection
                            /**********************************************/
                        }                                            
                        else                                          
                        {                                            
                            vec4 baseTextureColor = texture(uTexture, vtextureCoordinates); // Base texture color
                            /**********************************************/
                            // STEP 8c:
                            // Shade the base texture using ambientDiffuseColor and specularColor.
                            FragColor = vec4(baseTextureColor.rgb * ambientDiffuseColor + specularColor, baseTextureColor.a);
                            /**********************************************/

                        }                                            
                    }                                                
                    
                }                                                    
            
            </script>

        <script>            
            // Get the canvas element from the HTML document
            var canvas = document.getElementById("example");
            // Create a WebGL2 rendering context from the canvas
            var gl= canvas.getContext('webgl2');
            // Instantiate the WebGL helper class
            var myWebGL= new WebGL();
            // Event listener for mouse clicks
            canvas.addEventListener("contextmenu", (e) => e.preventDefault());

            // Lighting setup (Phong shader requires at least one light)
            var MainLight = new Light();
            MainLight.lightPosition = [0.0, -0.5, 1.0, 0.0]; // directional light from above and behind
            MainLight.lightAmbient = [0.2, 0.2, 0.2, 1.0];
            MainLight.lightDiffuse = [0.5, 0.5, 0.5, 1.0];
            MainLight.lightSpecular = [0.6, 0.6, 0.6, 1.0];

            // Second light near the water for a visible specular highlight
            var WaterLight = new Light();
            WaterLight.lightPosition = [0.0, 0.0, 2.0, 1.0]; // point light high above the water
            WaterLight.lightAmbient = [0.0, 0.0, 0.0, 1.0];
            WaterLight.lightDiffuse = [0.1, 0.15, 0.2, 1.0];
            WaterLight.lightSpecular = [0.5, 0.5, 0.5, 1.0];

            var Lights = [MainLight, WaterLight];

            // Small cube to mark the light position
            var s = 0.05; // half-size
            var lightMarkerVerts = [
                // Front
                -s,-s, s,  s,-s, s,  s, s, s,  -s,-s, s,  s, s, s,  -s, s, s,
                // Back
                -s,-s,-s,  -s, s,-s,  s, s,-s,  -s,-s,-s,  s, s,-s,  s,-s,-s,
                // Top
                -s, s,-s,  -s, s, s,  s, s, s,  -s, s,-s,  s, s, s,  s, s,-s,
                // Bottom
                -s,-s,-s,  s,-s,-s,  s,-s, s,  -s,-s,-s,  s,-s, s,  -s,-s, s,
                // Right
                s,-s,-s,  s, s,-s,  s, s, s,  s,-s,-s,  s, s, s,  s,-s, s,
                // Left
                -s,-s,-s,  -s,-s, s,  -s, s, s,  -s,-s,-s,  -s, s, s,  -s, s,-s
            ];
            var lightMarkerInds = [];
            for (var i = 0; i < 36; i++) lightMarkerInds.push(i);
            var lightMarker = new Shape(lightMarkerVerts, lightMarkerInds);
            lightMarker.position = [
                WaterLight.lightPosition[0],
                WaterLight.lightPosition[1],
                WaterLight.lightPosition[2]
            ];

            // Helper: set material color before rendering a shape
            function setMaterialColor(r, g, b) {
                setUniform4f(myWebGL, "ambientMat", r, g, b, 1.0);
                setUniform4f(myWebGL, "diffuseMat", r, g, b, 1.0);
                setUniform4f(myWebGL, "specularMat", 0.0, 0.0, 0.0, 1.0);
                setUniform1f(myWebGL, "shininess", 1.0);
            }




            // Camera 
            let moveSpeed = 0.02;
            let cameraUp = [0, -1, 0];

            const cameraA = {
                position: [0, 2.2, 1.7],
                target: [0, 0.1, -0.15]
            };

            const cameraB = {
                position: [0, -2.2, 1.7], // [0, -2.2, 1.7]
                target: [0, 0.1, -0.15]
            };

            let cameraPos = [...cameraA.position];
            let cameraTarget = [...cameraA.target];

            let keyW = false;
            let keyA = false;
            let keyS = false;
            let keyD = false;
            let keySpace = false;
            let keyShift = false;

            // Scene dimensions
            const outerX = 1.0;
            const outerY = 0.9;
            const innerX = 0.6;
            const innerY = 0.7;

            const grassZ = 0.20;
            const waterZ = -0.15;
    
            // Rectangles for water
            let waterWidth = 0.6;
            let sandWidth = 0.2;

            var waterVertices = [
                -waterWidth, -0.7, waterZ,
                waterWidth, -0.7, waterZ,
                waterWidth,  0.7, waterZ,

                -waterWidth, -0.7, waterZ,
                waterWidth,  0.7, waterZ,
                -waterWidth,  0.7, waterZ
            ];

            var waterIndices = [0,1,2, 3,4,5];

            var Water = new Shape(waterVertices, waterIndices);
            
            // Sand for beach
            var sandLeftVertices = [
                -outerX, -outerY, grassZ,
                -innerX, -innerY, waterZ,
                -innerX,  innerY, waterZ,

                -outerX, -outerY, grassZ,
                -innerX,  innerY, waterZ,
                -outerX,  outerY, grassZ
            ];

            var sandRightVertices = [
                innerX, -innerY, waterZ,
                outerX, -outerY, grassZ,
                outerX,  outerY, grassZ,

                innerX, -innerY, waterZ,
                outerX,  outerY, grassZ,
                innerX,  innerY, waterZ
            ];

            var sandTopVertices = [
                -outerX, outerY, grassZ,
                innerX, innerY, waterZ,
                outerX, outerY, grassZ,

                -outerX, outerY, grassZ,
                -innerX, innerY, waterZ,
                innerX, innerY, waterZ
            ];

            var sandBottomVertices = [
                -innerX, -innerY, waterZ,
                outerX, -outerY, grassZ,
                innerX, -innerY, waterZ,

                -innerX, -innerY, waterZ,
                -outerX, -outerY, grassZ,
                outerX, -outerY, grassZ
            ];



            // Grass
            var grassLeftVertices = [
                -4.0, -2.0, grassZ,
                -outerX, -2.0, grassZ,
                -outerX,  2.0, grassZ,

                -4.0, -2.0, grassZ,
                -outerX,  2.0, grassZ,
                -4.0,  2.0, grassZ
            ];

            var grassRightVertices = [
                outerX, -2.0, grassZ,
                4.0,    -2.0, grassZ,
                4.0,     2.0, grassZ,

                outerX, -2.0, grassZ,
                4.0,     2.0, grassZ,
                outerX,  2.0, grassZ
            ];

            var grassTopVertices = [
                -outerX, outerY, grassZ,
                outerX, outerY, grassZ,
                outerX, 2.0,    grassZ,

                -outerX, outerY, grassZ,
                outerX, 2.0,    grassZ,
                -outerX, 2.0,    grassZ
            ];

            var grassBottomVertices = [
                -outerX, -2.0, grassZ,
                outerX, -2.0, grassZ,
                outerX, -outerY, grassZ,

                -outerX, -2.0, grassZ,
                outerX, -outerY, grassZ,
                -outerX, -outerY, grassZ
            ];

            // Divider Line between grids
            var dividerVertices = [
                -0.35, 0, -0.08,
                0.35, 0, -0.08
            ];

            var dividerIndices = [0,1];

            var divider = new Shape(dividerVertices, dividerIndices);
            divider.drawMode = gl.LINES;

            var sandLeft = new Shape(sandLeftVertices, waterIndices);
            var sandRight = new Shape(sandRightVertices, waterIndices);
            var sandTop = new Shape(sandTopVertices, waterIndices);
            var sandBottom = new Shape(sandBottomVertices, waterIndices);

            var grassLeft = new Shape(grassLeftVertices, waterIndices);
            var grassRight = new Shape(grassRightVertices, waterIndices);
            var grassTop = new Shape(grassTopVertices, waterIndices);
            var grassBottom = new Shape(grassBottomVertices, waterIndices);

            var gridTop = createTileGrid(0.0, 0.30, 0.05, 0.0, 9);
            var gridBottom = createTileGrid(0.0, -0.30, 0.05, 0.0, 9);

            // Game state variables
            // Phases: "setup_a", "setup_b", "transition", "attack", "game_over"
            let gamePhase = "setup_a";
            let currentSetupPlayer = "bottom"; // "top" or "bottom"
            let isPlayerBView = false;

            //Ship Placements
            const SHIP_LENGTHS = [5, 4, 3, 2];
            const SHIP_NAMES = ["Carrier", "Battleship", "Cruiser", "Destroyer"];

            let playerAFleet = [];
            let playerBFleet = [];

            let availableShips = [];
            let selectedShip = null;
            let previewCells = [];

            // Attack phase tracking
            let currentAttacker = "A"; // "A" or "B"
            let playerAHits = new Set();  // keys of tiles A has hit on B's grid
            let playerAMisses = new Set();
            let playerBHits = new Set();  // keys of tiles B has hit on A's grid
            let playerBMisses = new Set();
            let winner = null;
            let lastShotResult = null; // {type: "hit"|"miss"|"sunk", tile, ship?}

            let hoveredTile = null;

            let mouseX = 0;
            let mouseY = 0;

            // UI element references
            const hudEl = document.getElementById("hud");
            const shipStatusEl = document.getElementById("ship-status");
            const transitionOverlay = document.getElementById("transition-overlay");
            const transitionText = document.getElementById("transition-text");
            const gameoverOverlay = document.getElementById("gameover-overlay");
            const gameoverText = document.getElementById("gameover-text");
            const confirmBtn = document.getElementById("confirmTurnBtn");
            const rotateBtn = document.getElementById("rotateShipBtn");

            availableShips = makeFleetForCurrentPlayer();

            canvas.addEventListener("mousemove", (e) => {
                let rect = canvas.getBoundingClientRect();

                let x = (e.clientX - rect.left) / rect.width;
                let y = (e.clientY - rect.top) / rect.height;

                mouseX = (x - 0.5) * 2;
                mouseY = (0.5 - y) * 2;

            });

            canvas.addEventListener("click", () => {
                if (gamePhase === "transition" || gamePhase === "game_over") return;

                const aspect = canvas.width / canvas.height;
                const ray = rayFromMouse(mouseX, mouseY, aspect, Math.PI / 3, cameraPos, cameraTarget, cameraUp);

                // --- SETUP PHASES ---
                if (gamePhase === "setup_a" || gamePhase === "setup_b") {
                    // side ships live on their own plane
                    const sideHit = intersectRayWithZPlane(ray.origin, ray.direction, 0.35);
                    if (sideHit) {
                        const picked = pickShipFromSide(sideHit[0], -sideHit[1]);
                        if (picked) {
                            selectedShip = picked;
                            previewCells = [];
                            return;
                        }
                    }

                    // grid placement lives on the grid plane
                    const gridHit = intersectRayWithZPlane(ray.origin, ray.direction, -0.10);
                    if (!gridHit) return;
                    if (!selectedShip) return;
                    if (previewCells.length !== selectedShip.length) return;

                    const activeFleet = currentSetupPlayer === "bottom" ? playerAFleet : playerBFleet;
                    selectedShip.placed = true;
                    selectedShip.cells = [...previewCells];
                    activeFleet.push(selectedShip);
                    selectedShip = null;
                    previewCells = [];
                    return;
                }

                // --- ATTACK PHASE ---
                if (gamePhase === "attack") {
                    const gridHit = intersectRayWithZPlane(ray.origin, ray.direction, -0.10);
                    if (!gridHit) return;

                    let hoverX = gridHit[0];
                    let hoverY = -gridHit[1]; // flip for size[1] = -1

                    // Attacker fires at the OPPONENT's grid
                    const targetGrid = currentAttacker === "A" ? gridTop : gridBottom;
                    const targetFleet = currentAttacker === "A" ? playerBFleet : playerAFleet;
                    const hitSet = currentAttacker === "A" ? playerAHits : playerBHits;
                    const missSet = currentAttacker === "A" ? playerAMisses : playerBMisses;

                    const clickedTile = getHoveredTile(hoverX, hoverY, targetGrid);
                    if (!clickedTile) return;

                    const key = getTileKey(clickedTile);

                    // Don't allow firing on same tile twice
                    if (hitSet.has(key) || missSet.has(key)) return;

                    const hitShip = checkHit(clickedTile, targetFleet);

                    if (hitShip) {
                        hitSet.add(key);
                        if (isShipSunk(hitShip, hitSet)) {
                            lastShotResult = { type: "sunk", tile: clickedTile, ship: hitShip };
                        } else {
                            lastShotResult = { type: "hit", tile: clickedTile };
                        }

                        // Check for win
                        if (isFleetSunk(targetFleet, hitSet)) {
                            winner = currentAttacker;
                            gamePhase = "game_over";
                            gameoverText.textContent = "Player " + winner + " Wins!";
                            gameoverOverlay.style.display = "flex";
                            confirmBtn.style.display = "none";
                            rotateBtn.style.display = "none";
                            updateHUD();
                            return;
                        }
                    } else {
                        missSet.add(key);
                        lastShotResult = { type: "miss", tile: clickedTile };
                    }

                    updateHUD();

                    // After firing, swap to transition
                    setTimeout(() => {
                        showTransition();
                    }, 800);
                }
            });

            // Rotate ship button
            rotateBtn.addEventListener("click", () => {
                if (selectedShip) {
                    selectedShip.horizontal = !selectedShip.horizontal;
                    updateShipPreview();
                }
            });
            // User can also press "R" key to rotate ship
            window.addEventListener("keydown", (e) => {
                if (e.key.toLowerCase() === "r" && selectedShip) {
                    selectedShip.horizontal = !selectedShip.horizontal;
                    updateShipPreview();
                }
            });

            // Confirm turn button (setup phases only)
            confirmBtn.addEventListener("click", () => {
                if (gamePhase === "setup_a") {
                    const allPlaced = availableShips.every(ship => ship.placed);
                    if (!allPlaced) return;

                    gamePhase = "transition";
                    transitionText.textContent = "Pass device to Player B";
                    transitionOverlay.style.display = "flex";

                } else if (gamePhase === "setup_b") {
                    const allPlaced = availableShips.every(ship => ship.placed);
                    if (!allPlaced) return;

                    // Both players placed, transition to attack
                    gamePhase = "transition";
                    transitionText.textContent = "All ships placed! Pass device to Player A";
                    transitionOverlay.style.display = "flex";

                } else if (gamePhase === "attack") {
                    // No confirm needed during attack
                }
            });

            // Click on transition overlay to continue
            transitionOverlay.addEventListener("click", () => {
                transitionOverlay.style.display = "none";

                if (gamePhase === "transition") {
                    // Figure out what comes next
                    if (playerBFleet.length === 0) {
                        // Player A just finished, switch to Player B setup
                        gamePhase = "setup_b";
                        cameraPos = [...cameraB.position];
                        cameraTarget = [...cameraB.target];
                        cameraUp = [0, 1, 0];
                        currentSetupPlayer = "top";
                        isPlayerBView = true;
                        selectedShip = null;
                        previewCells = [];
                        availableShips = makeFleetForCurrentPlayer();
                        confirmBtn.textContent = "Confirm Placement";
                        updateHUD();

                    } else if (currentAttacker === "A" && lastShotResult) {
                        // After A's shot, switch to B
                        currentAttacker = "B";
                        gamePhase = "attack";
                        cameraPos = [...cameraB.position];
                        cameraTarget = [...cameraB.target];
                        cameraUp = [0, 1, 0];
                        isPlayerBView = true;
                        lastShotResult = null;
                        updateHUD();

                    } else if (currentAttacker === "B" && lastShotResult) {
                        // After B's shot, switch to A
                        currentAttacker = "A";
                        gamePhase = "attack";
                        cameraPos = [...cameraA.position];
                        cameraTarget = [...cameraA.target];
                        cameraUp = [0, -1, 0];
                        isPlayerBView = false;
                        lastShotResult = null;
                        updateHUD();

                    } else {
                        // Both setups done, start attack phase with Player A
                        gamePhase = "attack";
                        currentAttacker = "A";
                        cameraPos = [...cameraA.position];
                        cameraTarget = [...cameraA.target];
                        cameraUp = [0, -1, 0];
                        isPlayerBView = false;
                        confirmBtn.style.display = "none";
                        rotateBtn.style.display = "none";
                        shipStatusEl.style.display = "block";
                        lastShotResult = null;
                        updateHUD();
                    }
                }
            });

            // Update the HUD text
            function updateHUD() {
                if (gamePhase === "setup_a") {
                    hudEl.textContent = "Player A: Place your ships";
                } else if (gamePhase === "setup_b") {
                    hudEl.textContent = "Player B: Place your ships";
                } else if (gamePhase === "attack") {
                    let msg = "Player " + currentAttacker + "'s turn — Click opponent's grid to fire";
                    if (lastShotResult) {
                        if (lastShotResult.type === "hit") msg = "Player " + currentAttacker + ": HIT!";
                        else if (lastShotResult.type === "miss") msg = "Player " + currentAttacker + ": Miss...";
                        else if (lastShotResult.type === "sunk") msg = "Player " + currentAttacker + ": SUNK the " + SHIP_NAMES[lastShotResult.ship.id] + "!";
                    }
                    hudEl.textContent = msg;
                } else if (gamePhase === "game_over") {
                    hudEl.textContent = "Game Over — Player " + winner + " wins!";
                }
                updateShipStatus();
            }

            // Update the ship status sidebar
            function updateShipStatus() {
                if (gamePhase !== "attack" && gamePhase !== "game_over") {
                    shipStatusEl.style.display = "none";
                    return;
                }
                shipStatusEl.style.display = "block";

                const myFleet = currentAttacker === "A" ? playerAFleet : playerBFleet;
                const myHitsAgainst = currentAttacker === "A" ? playerBHits : playerAHits;
                const oppFleet = currentAttacker === "A" ? playerBFleet : playerAFleet;
                const oppHits = currentAttacker === "A" ? playerAHits : playerBHits;

                let html = "<b>Your Ships:</b><br>";
                for (let ship of myFleet) {
                    const sunk = isShipSunk(ship, myHitsAgainst);
                    html += (sunk ? "☠ " : "🚢 ") + SHIP_NAMES[ship.id] + " (" + ship.length + ")<br>";
                }
                html += "<br><b>Enemy Ships:</b><br>";
                for (let ship of oppFleet) {
                    const sunk = isShipSunk(ship, oppHits);
                    html += (sunk ? "☠ " : "? ") + SHIP_NAMES[ship.id] + " (" + ship.length + ")" + (sunk ? " SUNK" : "") + "<br>";
                }
                shipStatusEl.innerHTML = html;
            }

            // Show the transition overlay
            function showTransition() {
                gamePhase = "transition";
                const nextPlayer = currentAttacker === "A" ? "B" : "A";
                transitionText.textContent = "Pass device to Player " + nextPlayer;
                transitionOverlay.style.display = "flex";
            }

            // key listeners
            window.addEventListener("keydown", (e) => {
                switch (e.key.toLowerCase()) {
                    case "w": keyW = true; break;
                    case "a": keyA = true; break;
                    case "s": keyS = true; break;
                    case "d": keyD = true; break;
                    case " ": keySpace = true; break;
                }

                if (e.key === "Shift") {
                    keyShift = true;
                }
            });

            window.addEventListener("keyup", (e) => {
                switch (e.key.toLowerCase()) {
                    case "w": keyW = false; break;
                    case "a": keyA = false; break;
                    case "s": keyS = false; break;
                    case "d": keyD = false; break;
                    case " ": keySpace = false; break;
                }

                if (e.key === "Shift") {
                    keyShift = false;
                }
            });

            function updateCamera() {
                // forward direction toward where camera is looking,
                // but flattened onto the water plane
                let forward = [
                    cameraTarget[0] - cameraPos[0],
                    0,
                    cameraTarget[2] - cameraPos[2]
                ];

                let len = Math.hypot(forward[0], forward[2]);
                if (len < 0.0001) {
                    forward = [0, 0, -1];
                } 
                else {
                    forward = [forward[0] / len, 0, forward[2] / len];
                }

                // right vector on the water plane
                let right = [forward[2], 0, -forward[0]];

                // keep same viewing tilt
                let lookOffset = [
                    cameraTarget[0] - cameraPos[0],
                    cameraTarget[1] - cameraPos[1],
                    cameraTarget[2] - cameraPos[2]
                ];

                if (keyShift) {
                    cameraPos[0] += forward[0] * moveSpeed;
                    cameraPos[2] += forward[2] * moveSpeed;
                }
                if (keySpace) {
                    cameraPos[0] -= forward[0] * moveSpeed;
                    cameraPos[2] -= forward[2] * moveSpeed;
                }
                if (!isPlayerBView) {
                    if (keyA) {
                        cameraPos[0] -= right[0] * moveSpeed;
                        cameraPos[2] -= right[2] * moveSpeed;
                    }
                    if (keyD) {
                        cameraPos[0] += right[0] * moveSpeed;
                        cameraPos[2] += right[2] * moveSpeed;
                    }
                } else {
                    if (keyA) {
                        cameraPos[0] += right[0] * moveSpeed;
                        cameraPos[2] += right[2] * moveSpeed;
                    }
                    if (keyD) {
                        cameraPos[0] -= right[0] * moveSpeed;
                        cameraPos[2] -= right[2] * moveSpeed;
                    }
                }

                // vertical only
                if (!isPlayerBView) {
                    if (keyW) {
                        cameraPos[1] -= moveSpeed;
                    }
                    if (keyS) {
                        cameraPos[1] += moveSpeed;
                    }
                } else {
                    if (keyW) {
                        cameraPos[1] += moveSpeed;
                    }
                    if (keyS) {
                        cameraPos[1] -= moveSpeed;
                    }
                }

                // restore the same camera tilt/look
                cameraTarget = [
                    cameraPos[0] + lookOffset[0],
                    cameraPos[1] + lookOffset[1],
                    cameraPos[2] + lookOffset[2]
                ];
            }

            // Make ships - positioned in front of each player's grid
            function makeFleetForCurrentPlayer() {
                return SHIP_LENGTHS.map((len, i) => ({
                    id: i,
                    length: len,
                    horizontal: true,
                    placed: false,
                    cells: [],
                    sideX: 0,
                    sideY: currentSetupPlayer === "bottom"
                        ? -1.05 - i * 0.09
                        :  1.05 + i * 0.09
                }));
            }

            // Check if a point is inside a rectangle (used for picking ships on the side)
            function pickShipFromSide(worldX, worldY) {
                for (let ship of availableShips) {
                    if (ship.placed) continue;

                    const width = ship.horizontal ? ship.length * 0.05 : 0.05;
                    const height = ship.horizontal ? 0.05 : ship.length * 0.05;

                    if (pointInRect(worldX, worldY, ship.sideX, ship.sideY, width, height)) {
                        return ship;
                    }
                }
                return null;
            }

            // Shows preview of where your ship will be on the grid
            function updateShipPreview() {
                previewCells = [];

                if (!selectedShip) return;
                if (!hoveredTile) return;

                const activeGrid = currentSetupPlayer === "bottom" ? gridBottom : gridTop;
                const activeFleet = currentSetupPlayer === "bottom" ? playerAFleet : playerBFleet;

                const cells = getPlacementCells(
                    hoveredTile,
                    selectedShip.length,
                    selectedShip.horizontal,
                    activeGrid
                );

                if (!cells) return;
                if (cellsOverlapPlacedShip(cells, activeFleet)) return;

                previewCells = cells;
            }

            // Draw ships on the side that haven't been placed yet
            function drawSideShips() {
                const flipY = -1;

                for (let ship of availableShips) {
                    if (ship.placed) continue;

                    const tileSize = 0.05;
                    const width = ship.horizontal ? ship.length * tileSize : tileSize;
                    const height = ship.horizontal ? tileSize : ship.length * tileSize;

                    const halfW = width / 2;
                    const halfH = height / 2;

                    const shipZ = 0.35;

                    const verts = [
                        ship.sideX - halfW, ship.sideY - halfH, shipZ,
                        ship.sideX + halfW, ship.sideY - halfH, shipZ,
                        ship.sideX + halfW, ship.sideY + halfH, shipZ,

                        ship.sideX - halfW, ship.sideY - halfH, shipZ,
                        ship.sideX + halfW, ship.sideY + halfH, shipZ,
                        ship.sideX - halfW, ship.sideY + halfH, shipZ
                    ];

                    const inds = [0, 1, 2, 3, 4, 5];
                    const shape = new Shape(verts, inds);
                    shape.size[1] = flipY;

                    if (selectedShip && selectedShip.id === ship.id) {
                        setMaterialColor(1.0, 0.8, 0.2); // yellow = selected
                    } else {
                        setMaterialColor(0.7, 0.7, 0.7); // gray = unselected
                    }
                    shape.render();
                }
            }

            function animate(){
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                let aspect = canvas.width / canvas.height;

                updateCamera();

                Projection(myWebGL, Math.PI / 3, canvas.width / canvas.height, 0.1, 100);
                View(myWebGL, cameraPos, cameraTarget, cameraUp);

                // Render all lights each frame
                for (var i = 0; i < Lights.length; i++) {
                    Lights[i].render(i, Lights.length);
                }

                const flipY = -1;

                grassLeft.size[1] = flipY;
                grassRight.size[1] = flipY;
                grassTop.size[1] = flipY;
                grassBottom.size[1] = flipY;

                sandLeft.size[1] = flipY;
                sandRight.size[1] = flipY;
                sandTop.size[1] = flipY;
                sandBottom.size[1] = flipY;

                Water.size[1] = flipY;
                divider.size[1] = flipY;

                // Render Scene - set material color before each group
                setMaterialColor(0.2, 0.7, 0.2); // green grass
                grassLeft.render();
                grassRight.render();
                grassTop.render();
                grassBottom.render();

                setMaterialColor(0.9, 0.8, 0.5); // sand
                sandLeft.render();
                sandRight.render();
                sandTop.render();
                sandBottom.render();

                // Water gets its own high-specular material for visible reflections
                setUniform4f(myWebGL, "ambientMat", 0.0, 0.25, 0.55, 1.0);
                setUniform4f(myWebGL, "diffuseMat", 0.0, 0.3, 0.6, 1.0);
                setUniform4f(myWebGL, "specularMat", 1.0, 1.0, 1.0, 1.0);
                setUniform1f(myWebGL, "shininess", 32.0);
                Water.render();

                setMaterialColor(0.0, 0.0, 0.0); // black divider
                divider.render();

                // Light marker cube (bright yellow so it's easy to spot)
                setMaterialColor(1.0, 1.0, 0.0);
                lightMarker.size[1] = flipY;
                lightMarker.render();

                // --- Tile coloring logic ---
                // Reset all tiles to default blue
                gridTop.forEach(tile => { tile.color = [0.10, 0.50, 0.90]; });
                gridBottom.forEach(tile => { tile.color = [0.10, 0.50, 0.90]; });

                if (gamePhase === "setup_a" || gamePhase === "setup_b") {
                    // Show placed ships for CURRENT player only
                    const setupFleet = gamePhase === "setup_a" ? playerAFleet : playerBFleet;
                    for (let ship of setupFleet) {
                        for (let cell of ship.cells) {
                            cell.color = [0.5, 0.5, 0.5];
                        }
                    }
                } else if (gamePhase === "attack" || gamePhase === "transition" || gamePhase === "game_over") {
                    // Current player sees their OWN ships as gray
                    const myFleet = currentAttacker === "A" ? playerAFleet : playerBFleet;
                    const myGrid = currentAttacker === "A" ? gridBottom : gridTop;

                    for (let ship of myFleet) {
                        for (let cell of ship.cells) {
                            cell.color = [0.5, 0.5, 0.5];
                        }
                    }

                    // Show hits/misses on the opponent's grid
                    const oppGrid = currentAttacker === "A" ? gridTop : gridBottom;
                    const oppFleet = currentAttacker === "A" ? playerBFleet : playerAFleet;
                    const myHits = currentAttacker === "A" ? playerAHits : playerBHits;
                    const myMisses = currentAttacker === "A" ? playerAMisses : playerBMisses;

                    // Show hits as red, sunk as dark red
                    for (let tile of oppGrid) {
                        const key = getTileKey(tile);
                        if (myHits.has(key)) {
                            // Check if the ship this tile belongs to is fully sunk
                            const ship = checkHit(tile, oppFleet);
                            if (ship && isShipSunk(ship, myHits)) {
                                tile.color = [0.6, 0.0, 0.0]; // dark red = sunk
                            } else {
                                tile.color = [1.0, 0.2, 0.1]; // red = hit
                            }
                        } else if (myMisses.has(key)) {
                            tile.color = [0.9, 0.9, 0.9]; // white = miss
                        }
                        // opponent ships stay hidden (blue) if not hit
                    }

                    // Also show hits the OPPONENT made on YOUR grid
                    const theirHits = currentAttacker === "A" ? playerBHits : playerAHits;
                    const theirMisses = currentAttacker === "A" ? playerBMisses : playerAMisses;

                    for (let tile of myGrid) {
                        const key = getTileKey(tile);
                        if (theirHits.has(key)) {
                            tile.color = [1.0, 0.2, 0.1]; // red = hit on your ship
                        } else if (theirMisses.has(key)) {
                            tile.color = [0.9, 0.9, 0.9]; // white = miss
                        }
                    }
                }

                // Hover detection
                const ray = rayFromMouse(mouseX, mouseY, aspect, Math.PI / 3, cameraPos, cameraTarget, cameraUp);
                const hitPoint = intersectRayWithZPlane(ray.origin, ray.direction, -0.10);

                hoveredTile = null;

                if (hitPoint) {
                    let hoverX = hitPoint[0];
                    let hoverY = -hitPoint[1]; // because of size[1] = -1 flip

                    if (gamePhase === "setup_a" || gamePhase === "setup_b") {
                        if (currentSetupPlayer === "bottom") {
                            hoveredTile = getHoveredTile(hoverX, hoverY, gridBottom);
                        } else if (currentSetupPlayer === "top") {
                            hoveredTile = getHoveredTile(hoverX, hoverY, gridTop);
                        }
                    } else if (gamePhase === "attack") {
                        // Hover on the opponent's grid only
                        const targetGrid = currentAttacker === "A" ? gridTop : gridBottom;
                        hoveredTile = getHoveredTile(hoverX, hoverY, targetGrid);

                        // Only highlight if the tile hasn't been shot yet
                        if (hoveredTile) {
                            const key = getTileKey(hoveredTile);
                            const hitSet = currentAttacker === "A" ? playerAHits : playerBHits;
                            const missSet = currentAttacker === "A" ? playerAMisses : playerBMisses;
                            if (hitSet.has(key) || missSet.has(key)) {
                                hoveredTile = null; // don't highlight already-shot tiles
                            }
                        }
                    }
                }

                if (hoveredTile) {
                    hoveredTile.color = [1.0, 1.0, 0.6]; // yellow hover
                }

                // Ship preview and side ships (setup only)
                if (gamePhase === "setup_a" || gamePhase === "setup_b") {
                    updateShipPreview();
                    drawSideShips();
                }

                // Apply preview cell coloring
                for (let cell of previewCells) {
                    cell.color = [0.8, 0.8, 0.8];
                }

                // Render tiles
                gridTop.forEach(tile => {
                    setUniform4f(myWebGL, "ambientMat", tile.color[0], tile.color[1], tile.color[2], 1.0);
                    setUniform4f(myWebGL, "diffuseMat", tile.color[0], tile.color[1], tile.color[2], 1.0);
                    setUniform4f(myWebGL, "specularMat", 1.0, 1.0, 1.0, 1.0);
                    setUniform1f(myWebGL, "shininess", 32.0);
                    tile.fill.size[1] = flipY;
                    tile.fill.render();
                    setMaterialColor(0.0, 0.0, 0.0); // black outline
                    tile.outline.size[1] = flipY;
                    tile.outline.render();
                });

                gridBottom.forEach(tile => {
                    setUniform4f(myWebGL, "ambientMat", tile.color[0], tile.color[1], tile.color[2], 1.0);
                    setUniform4f(myWebGL, "diffuseMat", tile.color[0], tile.color[1], tile.color[2], 1.0);
                    setUniform4f(myWebGL, "specularMat", 1.0, 1.0, 1.0, 1.0);
                    setUniform1f(myWebGL, "shininess", 32.0);
                    tile.fill.size[1] = flipY;
                    tile.fill.render();
                    setMaterialColor(0.0, 0.0, 0.0); // black outline
                    tile.outline.size[1] = flipY;
                    tile.outline.render();
                });

                requestAnimationFrame(animate);
            }
            animate();

        </script>

    </body>
